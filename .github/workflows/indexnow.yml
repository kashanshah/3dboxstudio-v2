name: IndexNow
# After Vercel reports a successful production deployment, tell Bing and the
# other IndexNow engines which sitemap URLs are new or changed.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every sitemap URL, not only new or changed ones
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The last submitted sitemap snapshot, so only new or changed URLs are
      # sent. It is kept as an artifact of the previous successful run: the
      # Actions cache cannot be used here because deployment_status events
      # are not tied to a branch.
      - name: Download previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow indexnow.yml --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name indexnow-state --dir . 2>/dev/null; then
              echo "Using state from run $id"; exit 0
            fi
          done
          echo "No previous state found; every sitemap URL will be submitted."
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow-state.json
          retention-days: 90
          if-no-files-found: error
          # The state file is a dotfile, which upload-artifact v4 skips by default.
          include-hidden-files: true
